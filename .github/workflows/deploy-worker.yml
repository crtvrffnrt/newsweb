name: Validate security news

on:
  push:
    branches:
      - main
    paths:
      - "src/data/news.json"
      - "src/**"
      - "scripts/validate-news.js"
      - "package.json"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-security-news
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate news data and source code
        run: npm test

      - name: Confirm newest news records
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import news from './src/data/news.json' with { type: 'json' };

          const newest = [...news]
            .sort((a, b) => b.addedAt.localeCompare(a.addedAt))
            .slice(0, 3);

          console.log('Newest records committed to GitHub:');
          for (const article of newest) {
            console.log(`- ${article.id}: ${article.title}`);
          }
          NODE
